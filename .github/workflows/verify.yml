name: Verify public source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Offline checks: generation, static contracts, publication scan. No native
  # replay core needed, so this runs on every push.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Audit indexed files
        run: python tools/audit-publication.py --strict
      - name: Check publication scanner
        run: python -m unittest discover -s tools/tests -p "test_*.py"
      - name: Verify candidate bindings and replay static contracts from the index
        run: python -B tools/verify-proxy-failover-release.py --static
      - name: Ensure tracked inputs were not rewritten
        run: git diff --exit-code

  # Release-only gate: the current candidate inventory is bound to exact
  # import bytes and limited native replay evidence. Old release receipts
  # remain historical and are never silently re-signed for new source bytes.
  # Current-candidate and device acceptance remain separate statuses.
  bound-release:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Audit indexed public source
        run: python tools/audit-publication.py --strict
      - name: Verify exact source and isolated Windows evidence
        run: python -B tools/verify-proxy-failover-release.py
      - name: Verify published attachments against the candidate inventory
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist/release-download
          python -B tools/verify-proxy-failover-release.py --assets dist/release-download
      - name: Ensure tracked inputs were not rewritten
        run: git diff --exit-code

  javascript-engines:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: routeweaver-engine-check
          - os: windows-latest
            executable: routeweaver-engine-check.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build the locked real-engine harness
        run: cargo +1.99.1 build --locked --release --manifest-path releases/v14.3/tests/engines/Cargo.toml --target-dir .work/js-engines
      - name: Compare Node, QuickJS and Boa on the current entries
        run: node releases/v14.3/tests/engine-parity.cjs .work/js-engines/release/${{ matrix.executable }}
